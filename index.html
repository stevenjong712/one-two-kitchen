<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Two Kitchen</title>
<meta name="theme-color" content="#F1EDFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: orange brand band + sticky tab bar, one centered working column; views swap below. */
/* Layout: soft pastel sidebar (bottom bar on phones) beside one working column; candy-pastel bento cards. */
:root{
  --bg:#F7F5FC; --surface:#FFFFFF; --sunk:#FAF8FE; --ink:#2C2A3D; --muted:#6D6984; --faint:#A29EB8; --line:#ECE8F5;
  --brand:#7B6EE6; --brand2:#A79DF5; --brand-ink:#5446C4; --brand-soft:#EEEBFF; --on-brand:#FFFFFF;
  --peach:#FFB8A1; --peach-soft:#FFEDE6; --peach-ink:#B4492B;
  --mint:#8FDDBA; --mint-soft:#E2F7EE; --mint-ink:#1E7A55;
  --butter:#FFE07A; --butter-soft:#FFF7D9; --butter-ink:#8A6400;
  --sky:#9CCBFF; --sky-soft:#E7F2FF; --sky-ink:#2F62C9;
  --pink:#F7B6D2; --pink-soft:#FDEBF3;
  --yolk:var(--butter); --yolk-soft:var(--butter-soft); --yolk-ink:var(--butter-ink);
  --side:#F1EDFF; --side2:#FDEEF5; --side-ink:#2C2A3D; --side-muted:#6D6984; --side-hi:rgba(123,110,230,.10);
  --good:#1E8A5C; --good-soft:#E2F7EE; --warn:#A86A00; --warn-soft:#FFF4D6; --bad:#D9485F; --bad-soft:#FFE8EC; --info:#3A6FD8; --info-soft:#E7F2FF;
  --shadow:0 1px 2px rgba(60,50,120,.05),0 10px 26px -14px rgba(90,70,200,.22);
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fd:"Bricolage Grotesque","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --r:18px; --side-w:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16141F; --surface:#1F1C2B; --sunk:#1B1926; --ink:#EEEAF8; --muted:#A9A3C2; --faint:#736D8C; --line:#2F2B40;
  --brand:#A99FF7; --brand2:#C3BBFA; --brand-ink:#C9C1FF; --brand-soft:#2C2748; --on-brand:#1A1630;
  --peach:#FFB8A1; --peach-soft:#3A2622; --peach-ink:#FFC4B0;
  --mint:#8FDDBA; --mint-soft:#1B3329; --mint-ink:#9BE8C6;
  --butter:#FFE07A; --butter-soft:#3A3218; --butter-ink:#FFE590;
  --sky:#9CCBFF; --sky-soft:#1C2A40; --sky-ink:#A9D2FF;
  --pink:#F7B6D2; --pink-soft:#3A2230;
  --side:#211D33; --side2:#2A1F30; --side-ink:#EEEAF8; --side-muted:#A9A3C2; --side-hi:rgba(169,159,247,.14);
  --good:#7FE0B2; --good-soft:#1B3329; --warn:#F2C45C; --warn-soft:#3A3218; --bad:#FF8FA0; --bad-soft:#3D1F27; --info:#A9C6FF; --info-soft:#1C2A40;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16141F; --surface:#1F1C2B; --sunk:#1B1926; --ink:#EEEAF8; --muted:#A9A3C2; --faint:#736D8C; --line:#2F2B40;
  --brand:#A99FF7; --brand2:#C3BBFA; --brand-ink:#C9C1FF; --brand-soft:#2C2748; --on-brand:#1A1630;
  --peach:#FFB8A1; --peach-soft:#3A2622; --peach-ink:#FFC4B0;
  --mint:#8FDDBA; --mint-soft:#1B3329; --mint-ink:#9BE8C6;
  --butter:#FFE07A; --butter-soft:#3A3218; --butter-ink:#FFE590;
  --sky:#9CCBFF; --sky-soft:#1C2A40; --sky-ink:#A9D2FF;
  --pink:#F7B6D2; --pink-soft:#3A2230;
  --side:#211D33; --side2:#2A1F30; --side-ink:#EEEAF8; --side-muted:#A9A3C2; --side-hi:rgba(169,159,247,.14);
  --good:#7FE0B2; --good-soft:#1B3329; --warn:#F2C45C; --warn-soft:#3A3218; --bad:#FF8FA0; --bad-soft:#3D1F27; --info:#A9C6FF; --info-soft:#1C2A40;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{flex:none;display:block}
/* header */
.top{background:linear-gradient(100deg,var(--brand2),var(--brand) 70%);color:var(--on-brand)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:12px;opacity:.9}
.top-r{display:flex;align-items:center;gap:8px}
.chipw{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chipw .dot{width:7px;height:7px;border-radius:50%;background:#fff}
.chipw.off .dot{background:#3a2a10;opacity:.5}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:inherit}
.top .iconbtn{background:rgba(255,255,255,.2)}
.top .iconbtn:hover{background:rgba(255,255,255,.32)}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab.on{background:var(--brand-soft);color:var(--brand-ink)}
.tab:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,.seg button:focus-visible,.daybtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding-block:22px 60px}
/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
select.inp{padding-right:28px}
textarea.inp{resize:vertical}
label.f,div.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.vh p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tool .inp{width:auto;min-width:0}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search .inp{width:100%;padding-left:34px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.alg{color:var(--bad);font-weight:600;display:flex;gap:5px;align-items:flex-start}
.alg .ic{margin-top:2px}
.muted{color:var(--muted)}
.lbl-cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:15px;margin:0}
/* dashboard */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:22px 24px;background:linear-gradient(110deg,var(--brand2),var(--brand));color:var(--on-brand);margin-bottom:16px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.hero .eb{display:inline-block;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero h1{margin:10px 0 4px;font-size:clamp(20px,3vw,28px);letter-spacing:-.02em;line-height:1.15;max-width:46ch;text-wrap:balance}
.hero p{margin:0;opacity:.95}
.hero .btn{background:rgba(255,255,255,.95);border-color:transparent;color:#7A3B00}
.hero .btn.alt{background:rgba(255,255,255,.18);color:#fff}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ki{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span.s{font-size:12px;color:var(--muted)}
.ki.brand{background:var(--brand-soft);color:var(--brand-ink)}.ki.info{background:var(--info-soft);color:var(--info)}.ki.ok{background:var(--good-soft);color:var(--good)}.ki.bad{background:var(--bad-soft);color:var(--bad)}
.stack{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.bar .tr{height:22px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px}
.bar .mn{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 16px);color:var(--ink);mix-blend-mode:normal}
.bar.today .tr{outline:2px solid var(--brand);outline-offset:1px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.cnt{flex:1 1 110px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.cnt small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.cnt b{font-size:20px;font-variant-numeric:tabular-nums}
/* schedule */
.week{display:grid;grid-template-columns:repeat(6,minmax(118px,1fr));gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:14px}
.daybtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:3px;min-width:0}
.daybtn:hover{border-color:var(--faint)}
.daybtn.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft) inset;background:var(--brand-soft)}
.daybtn .dn{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.daybtn .dd{font-weight:800;font-size:16px}
.daybtn .dm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daybtn .dc{font-size:12px;font-weight:700;color:var(--brand-ink)}
.daybtn.isToday .dn::after{content:" · hari ini";color:var(--brand-ink)}
.dayhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:18px;border-bottom:1px solid var(--line)}
.dayhead h2{margin:0;font-size:18px}
.menupick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.menupick .inp{max-width:440px}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 18px;background:var(--sunk);font-weight:700;flex-wrap:wrap}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px 14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.grp-h + .erow{border-top:0}
.erow .en b{font-weight:700}
.schstrip{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:thin}
.schc{display:flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.schc b{font-size:20px;font-weight:800;color:var(--brand-ink);line-height:1}
.schc:hover{border-color:var(--brand)}.schc.on{border-color:var(--brand);background:var(--brand-soft)}
.ghn{display:inline-flex;align-items:center;gap:10px}
.gcount{background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800}
.enl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pk{display:inline-flex;align-items:center;gap:5px;border:1.5px solid;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer;background:transparent;font-family:inherit;white-space:nowrap}
.pk-pb{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.pk-lb{color:var(--yolk-ink);border-color:var(--yolk);background:var(--yolk-soft)}
.pk:hover{filter:brightness(.97)}.pk:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.erow .en .sub{font-size:12.5px;color:var(--muted)}
.erow .en .alg,.erow .en .nt{font-size:12.5px}
.erow .en .nt{color:var(--info)}
.erow.st-cancelled .en b{text-decoration:line-through;color:var(--faint)}
.erow .ep{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on.s-scheduled{background:var(--surface);color:var(--info);box-shadow:var(--shadow)}
.seg button.on.s-delivered{background:var(--good);color:#fff}
.seg button.on.s-cancelled{background:var(--bad);color:#fff}
.eact{display:flex;gap:2px}
.eact .iconbtn{width:32px;height:32px;color:var(--muted)}
.eact .iconbtn:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:720px){.erow{grid-template-columns:minmax(0,1fr) auto}.erow .seg{grid-column:1/-1;justify-self:start}.erow .eact{grid-row:1;grid-column:2}.erow .ep{grid-row:2;grid-column:2;justify-self:end}}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
/* kids */
.kids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.kid{padding:14px 16px;display:grid;gap:7px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.kid:hover{border-color:var(--faint)}
.kid.inactive{opacity:.6}
.kid .top1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kid .nm{font-weight:800;font-size:15px;letter-spacing:.01em;text-transform:uppercase}
.kid .sc{font-size:12.5px;color:var(--muted)}
.days{display:flex;gap:3px}
.days i{font-style:normal;width:22px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--sunk);color:var(--faint)}
.days i.on{background:var(--brand-soft);color:var(--brand-ink)}
.kid .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
/* menu */
.menus{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.menu{padding:16px;display:grid;gap:8px;align-content:start}
.menu h3{margin:0;font-size:15px;line-height:1.35;text-wrap:balance}
.menu .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.daychips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t td b{font-weight:700}
.t .acts{display:flex;gap:4px;justify-content:flex-end}
.neg{color:var(--bad)} .pos{color:var(--good)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 10px}
.subtabs button{border:0;background:transparent;padding:12px 10px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--brand-ink);border-color:var(--brand)}
/* labels */
.lbls{display:flex;flex-wrap:wrap;gap:14px;padding:18px}

.lbl.skip{opacity:.3}
.lbl::before{content:"";position:absolute;inset:.8mm;border:.4mm solid #111;border-radius:1.2mm;pointer-events:none}
.lbl .lh{display:flex;justify-content:space-between;gap:4px;font-size:calc(8.5px*var(--s));border-bottom:.3mm solid #111;padding-bottom:calc(.6mm*var(--s));white-space:nowrap}
.lbl .lh b{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.lbl .ln{display:flex;justify-content:space-between;align-items:center;gap:calc(1.2mm*var(--s));font-weight:800;font-size:calc(17px*var(--s));line-height:1.05}
.lbl .lnn{white-space:nowrap;overflow:hidden;min-width:0;flex:1}

.lbl .lp{flex:none;border:.35mm solid #111;border-radius:.6mm;padding:.2mm calc(.9mm*var(--s));font-size:max(calc(9px*var(--s)),8px);font-weight:800}
.lbl .ls{display:flex;align-items:center;gap:calc(1.2mm*var(--s));min-width:0}
.lbl .lsc{flex:1;min-width:0;font-weight:500;text-transform:uppercase;font-size:max(calc(12.6px*var(--s)),9.6px);line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lbl .lg{flex:none;color:#111;font-weight:500;font-size:max(calc(12.6px*var(--s)),9.6px);line-height:1.05;text-transform:uppercase;white-space:nowrap}
.lbl .lm{flex:1;min-height:0;font-size:max(calc(9.8px*var(--s)),8.6px);line-height:1.13;text-transform:uppercase;overflow:hidden}
.lbl .lq{flex:none;border:.5mm solid #111;border-radius:.7mm;padding:calc(.9mm*var(--s));font-weight:500;text-transform:uppercase;font-size:max(calc(10.1px*var(--s)),8.8px);line-height:1.13;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4}

.lbl .lm+*{margin-top:auto}
.lbl .lnt{flex:none;display:flex;align-items:flex-start;gap:calc(1mm*var(--s));border-top:.35mm dashed #111;border-bottom:.35mm dashed #111;padding:calc(.6mm*var(--s)) 0;font-weight:500;text-transform:uppercase;font-size:max(calc(9.3px*var(--s)),8.4px);line-height:1.12}
.lbl.tight .lq{font-size:max(calc(9px*var(--s)),7.6px);padding:calc(.6mm*var(--s))}
.lbl.tight .lnt{font-size:max(calc(8.4px*var(--s)),7.4px);padding:calc(.35mm*var(--s)) 0}
.lbl.tight .lh{padding-bottom:calc(.35mm*var(--s))}
.lbl .lnt b{flex:none;font-weight:800;background:#111;color:#fff;border-radius:.5mm;padding:.2mm calc(.8mm*var(--s));font-size:max(calc(8px*var(--s)),7.4px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lbl .lnt span{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}

.howto{display:grid;gap:4px;font-size:13px;color:var(--muted);margin:0;padding-left:18px}

/* print */
#printArea{display:none}

}

<script>
(function(){
"use strict";
/* ---------- utils ---------- */

 left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',

 money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',

};

/* ---------- state ---------- */
const DEFAULT_CFG={name:'One Two Kitchen',tagline:'Daily Kid Catering Management System',price:60000,lowPorsi:3,labelFooter:'',labelSize:'80x50',labelSizes:[]};
const S={kids:{},menus:{},days:{},pays:{},exps:{},cfg:{...DEFAULT_CFG},mode:'connecting',canWrite:true,fresh:false,stale:false};

  const nm=addDays(mondayOf(TODAY),7); UI.jDate=nm; UI.lDate=nm;

/* ---------- store (Supabase) ---------- */
const SB_URL='https://bhajqsfkedrmabvxhcad.supabase.co',SB_KEY='sb_publishable_N2UggfZweN_-Fn0MbelBOQ_sBcIUoJd';
let sb=null,me=null,myRole='';
const qmap={};
function queue(key,fn){const p=(qmap[key]||Promise.resolve()).then(fn);qmap[key]=p.catch(()=>{});return p}
async function sbq(q){const r=await q;if(r.error)throw r.error;return r.data}

}

}

  list.forEach(([c,id,d])=>{if(c==='config')S.cfg={...DEFAULT_CFG,...d};else S[c]={...S[c],[id]:d}});memoB=null;schedule();
  try{for(let i=0;i<list.length;i+=200)await sbq(sb.from('otk_docs').upsert(list.slice(i,i+200).map(([col,id,data])=>({col,id,data}))))}catch(e){writeErr(e);return false}
  return true;
}

}

}

const kidsArr=()=>Object.entries(S.kids).map(([id,k])=>({id,...k}));

const kidDays=k=>Array.isArray(k.days)&&k.days.length?k.days:[1,2,3,4,5];
const priceFor=(k,m)=>Number(k&&k.price)||Number(m&&m.price)||Number(S.cfg.price)||0;

function info(kidId,e){const k=S.kids[kidId];return{name:(k&&k.name)||e.name||'(anak dihapus)',school:(k&&k.school)||e.school||'-',grade:(k&&k.grade)||e.grade||'',pack:e.pack||(k&&k.pack)||'',allergy:(k&&k.allergy)||e.allergy||'',parent:(k&&k.parent)||'',wa:(k&&k.wa)||''}}

const menuName=d=>d?((S.menus[d.menuId]&&S.menus[d.menuId].name)||d.menuName||''):'';

const dayClone=date=>S.days[date]?clone(S.days[date]):blankDay(date);

const PAYT={topup:'Top-up / DP',refund:'Refund ke ortu',discount:'Diskon / kompensasi',adjust:'Koreksi saldo'};
let memoB=null;
function bal(){
  if(memoB)return memoB;
  const B={};const g=k=>B[k]||(B[k]={dep:0,used:0,res:0,up:0,rp:0,bal:0});
  for(const p of Object.values(S.pays))g(p.kidId).dep+=payVal(p);

  for(const b of Object.values(B))b.bal=b.dep-b.used-b.res;
  return memoB=B;
}
const ZB={dep:0,used:0,res:0,up:0,rp:0,bal:0};
function stat(b){
  const low=(Number(S.cfg.lowPorsi)||3)*(Number(S.cfg.price)||60000);
  if(b.bal<0)return{k:'bad',l:'Kurang bayar'};

  return{k:'ok',l:'Aman'};
}
function menuUsage(){const u={};for(const d of Object.values(S.days)){if(!d.menuId)continue;const x=u[d.menuId]||(u[d.menuId]={n:0,last:''});x.n++;if(d.date>x.last)x.last=d.date}return u}
function suggestMenu(date,excludeIds){
  if(S.days[date]&&S.days[date].menuId)return S.days[date].menuId;

/* ----- Dashboard ----- */
const dishParts=n=>String(n||'').split('+').map(x=>x.trim()).filter(Boolean);
const DAYC={Senin:'lav',Selasa:'pch',Rabu:'mnt',Kamis:'btr',Jumat:'sky',Sabtu:'pnk'};
const greet=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
VIEWS.dashboard=()=>{
  const B=bal(),ak=activeKids(),t=S.days[TODAY],tE=liveEntries(t),done=tE.filter(([,e])=>e.status==='delivered').length;
  let wk=0;const mon=mondayOf(TODAY);for(let i=0;i<7;i++)wk+=dayCount(S.days[addDays(mon,i)]);
  const flagged=ak.map(k=>({...k,b:B[k.id]||ZB})).filter(k=>['bad','warn'].includes(stat(k.b).k)).sort((a,b)=>a.b.bal-b.b.bal);
  const owe=Object.values(B).reduce((s,b)=>s+(b.bal<0?-b.bal:0),0);
  const nextDay=Object.keys(S.days).filter(d=>d>TODAY&&dayCount(S.days[d])).sort()[0];
  const focus=t&&tE.length?TODAY:nextDay;const fd=focus?S.days[focus]:null;const fE=liveEntries(fd);
  const fDone=fE.filter(([,e])=>e.status==='delivered').length;
  const fx=fE.map(([k,e])=>({k,e,...info(k,e)}));
  const pb=fx.filter(x=>x.pack!=='Lunch Box').length,lb=fx.length-pb;
  /* hero */
  let hero;
  if(!kidsArr().length&&!menusArr().length){
    hero=`<div class="h-left"><span class="eb">Mulai di sini</span><h1>Selamat datang di ${esc(S.cfg.name)}</h1><p class="h-sub">Tambahkan data anak dan ide menu, lalu buat jadwal mingguan. Saldo DP terpotong otomatis per porsi.</p><div class="row"><a class="btn" data-act="go" data-t="anak" href="javascript:void 0">${I('users',16)}Tambah anak</a><a class="btn alt" data-act="go" data-t="menu" href="javascript:void 0">${I('book',16)}Tambah menu</a></div></div>`;
  }else if(fd){
    const parts=dishParts(menuName(fd));const pct=fE.length?Math.round(fDone/fE.length*100):0;const C=2*Math.PI*52;
    hero=`<div class="h-left"><span class="eb">${focus===TODAY?'Hari ini · ':'Berikutnya · '}${esc(fmtD(focus))}</span>
      <h1>${greet()}, tim dapur</h1>
      <p class="h-sub">${focus===TODAY?'Menu yang dimasak hari ini':'Tidak ada pengiriman hari ini. Menu jadwal berikutnya'}</p>
      ${parts.length?`<ol class="dish">${parts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`:`<p class="h-sub">Menu belum dipilih.</p>`}
      <div class="row"><button class="btn" data-act="goDay" data-d="${focus}">${I('truck',16)}Buka pengiriman</button><button class="btn alt" data-act="goLabel" data-d="${focus}">${I('printer',16)}Cetak label</button></div></div>
      <div class="h-right"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="rt"/><circle cx="60" cy="60" r="52" class="rf" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"/></svg><div class="rc"><b class="num">${fE.length}</b><span>porsi</span></div></div>
      <p class="rl"><b class="num">${fDone}</b> dari ${fE.length} terkirim</p>
      <div class="hpk"><span class="pk pk-pb" style="cursor:default">Plastic Box ${pb}</span><span class="pk pk-lb" style="cursor:default">Lunch Box ${lb}</span></div></div>`;
  }else{
    hero=`<div class="h-left"><span class="eb">${esc(fmtD(TODAY))}</span><h1>${greet()}, tim dapur</h1><p class="h-sub">Belum ada jadwal ke depan. Buat jadwal minggu ini dari menu yang sudah ada.</p><div class="row"><button class="btn" data-act="weekGen" data-d="${UI.jDate}">${I('wand',16)}Buat jadwal minggu</button></div></div>`;
  }
  /* sekolah */
  const bySch={};fx.forEach(x=>bySch[x.school]=(bySch[x.school]||0)+1);
  const schL=Object.entries(bySch).sort((a,b)=>b[1]-a[1]||cmpN(a[0],b[0]));const smx=Math.max(1,...schL.map(x=>x[1]));
  const tones=['lav','pch','mnt','btr','sky','pnk'];
  const schoolCard=`<div class="card pad"><div class="sec-h"><h2>Per sekolah${focus&&focus!==TODAY?' · '+esc(shortD(focus)):''}</h2><span class="pill">${fx.length} porsi</span></div>
    ${schL.length?`<div class="sbars">${schL.map(([sc,n],i)=>`<div class="sbar"><span class="sn">${esc(sc)}</span><span class="st"><span class="sf t-${tones[i%6]}" style="width:${Math.max(8,n/smx*100)}%"></span></span><b class="num">${n}</b></div>`).join('')}</div>`:empty('Belum ada porsi','Buat jadwal untuk melihat pembagian per sekolah.')}</div>`;
  /* request & catatan */
  const req=fx.filter(x=>(x.allergy&&x.allergy!=='-')||x.e.note).sort(sortKids);
  const reqCard=`<div class="card pad"><div class="sec-h"><h2>Request & alergi</h2><span class="pill ${req.length?'bad':''}">${req.length} anak</span></div>
    ${req.length?`<div class="reql">${req.map(x=>`<div class="rq"><div class="rqh"><b>${esc(x.name)}</b><span>${esc(x.school)} · ${esc(x.grade)}</span></div><div class="rqt">${x.allergy&&x.allergy!=='-'?`<span class="tag tg-bad">${I('alert',12)}${esc(x.allergy)}</span>`:''}${x.e.note?`<span class="tag tg-note">Catatan: ${esc(x.e.note)}</span>`:''}</div></div>`).join('')}</div>`:empty('Tidak ada request khusus','Alergi dan catatan per porsi akan tampil di sini.')}</div>`;
  /* upcoming days as cards */
  const up=[];let d=TODAY;while(up.length<10){const w=parseD(d).getDay();if(w!==0&&(w!==6||S.days[d]))up.push(d);d=addDays(d,1)}
  const upCard=`<div class="card pad"><div class="sec-h"><h2>Jadwal 2 minggu ke depan</h2><a class="btn sm" data-act="go" data-t="jadwal" href="javascript:void 0">Buka jadwal</a></div>
    <div class="upd">${up.map(x=>{const dd=S.days[x],n=dayCount(dd),w=parseD(x).getDay();return`<button type="button" class="upc t-${DAYC[DAYN[w]]||'lav'}${x===TODAY?' now':''}${n?'':' none'}" data-act="goDay" data-d="${x}"><span class="ud">${DAYN[w].slice(0,3)}</span><b class="num">${parseD(x).getDate()}</b><span class="um">${MON[parseD(x).getMonth()]}</span><span class="un num">${n?n+' porsi':'—'}</span><span class="umn">${esc(dishParts(menuName(dd))[0]||'')}</span></button>`}).join('')}</div></div>`;
  const recent=Object.entries(S.pays).map(([id,p])=>({id,...p})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0)).slice(0,5);
  return`<section class="hero hero2">${hero}</section>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><span class="ki info">${I('users',22)}</span><div><small>Anak aktif</small><b>${ak.length}</b><span class="s">${kidsArr().length-ak.length} nonaktif</span></div></div>
    <div class="card kpi"><span class="ki brand">${I('box',22)}</span><div><small>Porsi hari ini</small><b>${tE.length}</b><span class="s">${done} terkirim</span></div></div>
    <div class="card kpi"><span class="ki ok">${I('cal',22)}</span><div><small>Porsi minggu ini</small><b>${wk}</b><span class="s">Senin–Minggu</span></div></div>
    <div class="card kpi"><span class="ki bad">${I('wallet',22)}</span><div><small>Perlu ditagih</small><b class="num">${rp(owe)}</b><span class="s">${flagged.length} anak</span></div></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">${schoolCard}${reqCard}</div>
  <div style="margin-bottom:16px">${upCard}</div>
  <div class="grid g2">
    <div class="card pad"><div class="sec-h"><h2>Perlu top-up DP</h2><a class="btn sm" data-act="go" data-t="keuangan" href="javascript:void 0">Semua saldo</a></div>
      ${flagged.length?flagged.slice(0,6).map(k=>`<div class="li"><div class="t"><b>${esc(k.name)}</b><span>${esc(k.school)} · ${esc(k.grade)}</span></div><div class="row" style="flex-wrap:nowrap"><b class="num ${k.b.bal<0?'neg':''}">${rp(k.b.bal)}</b><button class="btn sm" data-act="bill" data-k="${k.id}" title="Pesan tagihan" aria-label="Pesan tagihan ${esc(k.name)}">${I('send',14)}</button><button class="btn sm pri" data-act="payNew" data-k="${k.id}">+DP</button></div></div>`).join('')+(flagged.length>6?`<p class="hint" style="margin-top:10px">+${flagged.length-6} anak lainnya di Keuangan</p>`:''):empty('Semua saldo aman','Anak dengan saldo minus atau menipis akan muncul di sini.')}
    </div>
    <div class="card pad"><div class="sec-h"><h2>Pembayaran terakhir</h2><button class="btn sm pri" data-act="payNew">${I('plus',14)}Catat DP</button></div>
      ${recent.length?recent.map(p=>{const k=S.kids[p.kidId];return`<div class="li"><div class="t"><b>${esc(k?k.name:'(anak dihapus)')}</b><span>${shortD(p.date)} · ${PAYT[p.type]||p.type}${p.method?' · '+esc(p.method):''}</span></div><b class="num ${payVal(p)<0?'neg':'pos'}">${payVal(p)<0?'-':'+'}${rp(Math.abs(payVal(p)))}</b></div>`}).join(''):empty('Belum ada pembayaran','Catat DP pertama untuk mulai memotong saldo per porsi.')}
    </div>
  </div>`;
};

/* ----- Jadwal ----- */
VIEWS.jadwal=()=>{
  const mon=mondayOf(UI.jDate);
  const week=[0,1,2,3,4,5].map(i=>addDays(mon,i));
  const strip=week.map(x=>{const d=S.days[x],n=dayCount(d),done=liveEntries(d).filter(([,e])=>e.status==='delivered').length;
    return`<button class="daybtn${x===UI.jDate?' on':''}${x===TODAY?' isToday':''}" data-act="jSel" data-d="${x}"><span class="dn">${DAYN[parseD(x).getDay()]}</span><span class="dd">${shortD(x)}</span><span class="dm">${esc(menuName(d)||(n?'Menu belum dipilih':'Belum ada jadwal'))}</span><span class="dc">${n?n+' porsi'+(done?' · '+done+' ✓':''):'—'}</span></button>`}).join('');
  const date=UI.jDate,d=S.days[date];
  let body;
  if(!d||!Object.keys(d.entries||{}).length){
    body=`<div class="dayhead"><div><span class="lbl-cap">${esc(dowName(date))}</span><h2>${fmtD(date)}</h2></div></div>`+empty('Belum ada jadwal di hari ini','Pilih menu dan anak yang makan di tanggal ini. Anak yang berlangganan hari '+esc(dowName(date))+' langsung tercentang.',`<div class="row"><button class="btn pri" data-act="assign" data-d="${date}">${I('plus',16)}Jadwalkan hari ini</button><button class="btn" data-act="weekGen" data-d="${date}">${I('wand',16)}Buat seminggu sekaligus</button></div>`);
  }else{
    const all=Object.entries(d.entries).map(([k,e])=>({k,e,...info(k,e)})).sort(sortKids);
    const live=all.filter(x=>x.e.status!=='cancelled');
    const done=live.filter(x=>x.e.status==='delivered').length,canc=all.length-live.length;
    const byPack={};live.forEach(x=>{const p=x.pack==='Lunch Box'?'Lunch Box':'Plastic Box';byPack[p]=(byPack[p]||0)+1});
    const total=live.reduce((s,x)=>s+(Number(x.e.price)||0),0);
    const groups={};all.filter(x=>!UI.jPack||(x.pack==='Lunch Box'?'Lunch Box':'Plastic Box')===UI.jPack).forEach(x=>(groups[x.school]=groups[x.school]||[]).push(x));
    const seg=(x)=>`<div class="seg" role="group" aria-label="Status">${[['scheduled','Jadwal'],['delivered','Terkirim'],['cancelled','Batal']].map(([s,l])=>`<button type="button" class="s-${s}${x.e.status===s?' on':''}" data-act="est" data-d="${date}" data-k="${x.k}" data-s="${s}" aria-pressed="${x.e.status===s}">${l}</button>`).join('')}</div>`;
    body=`<div class="dayhead"><div style="min-width:0;flex:1"><span class="lbl-cap">${esc(dowName(date))}${date===TODAY?' · hari ini':''}</span><h2>${fmtD(date)}</h2>
      <div class="menupick"><select class="inp" id="jMenu" data-chg="dayMenu" data-d="${date}" aria-label="Menu hari ini">${menuOptions(d.menuId)}</select></div>
      ${S.menus[d.menuId]&&S.menus[d.menuId].notes?`<p class="hint" style="margin-top:6px">Catatan menu: ${esc(S.menus[d.menuId].notes)}</p>`:''}</div>
      <div class="row"><button class="btn pri" data-act="allDone" data-d="${date}">${I('check',16)}Semua terkirim</button><button class="btn" data-act="assign" data-d="${date}">${I('users',16)}Atur anak</button><button class="btn" data-act="dayCopy" data-d="${date}">${I('copy',16)}Rekap WA</button><button class="btn" data-act="goLabel" data-d="${date}">${I('printer',16)}Label</button><button class="btn ghost" data-act="dayClear" data-d="${date}" title="Hapus jadwal hari ini">${I('trash',16)}</button></div></div>
      <div class="schstrip">${(()=>{const c={};live.forEach(x=>c[x.school]=(c[x.school]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]||cmpN(a[0],b[0])).map(([sc,n])=>`<a class="schc" href="javascript:void 0" data-act="jumpSch" data-s="${esc(sc)}"><b class="num">${n}</b><span>${esc(sc)}</span></a>`).join('')})()}</div>
      <div class="sumbar"><span class="pill info">${live.length} porsi</span><span class="pill ok">${done} terkirim</span>${canc?`<span class="pill bad">${canc} batal</span>`:''}${['Plastic Box','Lunch Box'].map(p=>`<button type="button" class="pk ${p==='Lunch Box'?'pk-lb':'pk-pb'}" data-act="jPack" data-v="${p}" aria-pressed="${UI.jPack===p}" style="${UI.jPack&&UI.jPack!==p?'opacity:.45':''}" title="Tampilkan hanya ${p}">${p}: ${byPack[p]||0}</button>`).join('')}${UI.jPack?`<button type="button" class="btn sm ghost" data-act="jPack" data-v="">Tampilkan semua</button>`:''}<span class="pill">Nilai ${rp(total)}</span></div>
      ${Object.entries(groups).sort((a,b)=>cmpN(a[0],b[0])).map(([sch,xs])=>`<div class="grp" data-sch="${esc(sch)}"><div class="grp-h"><span class="ghn">${esc(sch)}<span class="gcount num">${xs.filter(x=>x.e.status!=='cancelled').length} anak</span></span><span class="muted" style="font-weight:600;font-size:12.5px">${(()=>{const lv=xs.filter(x=>x.e.status!=='cancelled');const pb=lv.filter(x=>(x.pack||'Plastic Box')!=='Lunch Box').length,lb=lv.length-pb;return 'Plastic Box '+pb+' · Lunch Box '+lb})()}</span></div>
        ${xs.map(x=>`<div class="erow st-${x.e.status}"><div class="en"><div class="enl"><b>${esc(x.name)}</b><span class="sub">${esc(x.grade)}</span>${packPill(x.pack,` data-act="ePack" data-d="${date}" data-k="${x.k}" title="Klik untuk ganti kemasan hari ini" aria-label="Kemasan ${esc(x.pack||'Plastic Box')}, klik untuk ganti"`)}</div>${x.allergy&&x.allergy!=='-'?`<div class="alg">${I('alert',13)}<span>${esc(x.allergy)}</span></div>`:''}${x.e.note?`<div class="nt">Catatan: ${esc(x.e.note)}</div>`:''}</div><span class="ep">${rp(x.e.price)}</span>${seg(x)}<div class="eact"><button class="iconbtn" data-act="eEdit" data-d="${date}" data-k="${x.k}" aria-label="Ubah porsi ${esc(x.name)}">${I('edit',16)}</button><button class="iconbtn" data-act="eDel" data-d="${date}" data-k="${x.k}" aria-label="Hapus ${esc(x.name)} dari jadwal">${I('x',16)}</button></div></div>`).join('')}</div>`).join('')}`;
  }
  return`<div class="vh"><div><h1>Jadwal & Pengiriman</h1><p>Minggu ${shortD(mon)} – ${shortD(addDays(mon,5))} ${parseD(mon).getFullYear()}. Saldo DP terpotong per porsi; status Batal mengembalikan saldo.</p></div>
    <div class="row"><button class="iconbtn" data-act="jWeek" data-n="-7" aria-label="Minggu sebelumnya" style="border:1px solid var(--line);background:var(--surface)">${I('left')}</button><input type="date" class="inp" id="jDate" data-bind="jDate" value="${UI.jDate}" style="width:auto" aria-label="Pilih tanggal"><button class="iconbtn" data-act="jWeek" data-n="7" aria-label="Minggu berikutnya" style="border:1px solid var(--line);background:var(--surface)">${I('right')}</button><button class="btn" data-act="jSel" data-d="${TODAY}">Hari ini</button><button class="btn pri" data-act="weekGen" data-d="${UI.jDate}">${I('wand',16)}Buat jadwal minggu</button></div></div>
  <div class="week">${strip}</div>
  <div class="card">${body}</div>`;
};

/* ----- Anak ----- */
VIEWS.anak=()=>{
  const B=bal();const q=UI.aQ.trim().toLowerCase();
  let ks=kidsArr();const tot=ks.length;
  if(UI.aShow==='active')ks=ks.filter(k=>k.active!==false);else if(UI.aShow==='inactive')ks=ks.filter(k=>k.active===false);
  if(UI.aSchool)ks=ks.filter(k=>k.school===UI.aSchool);
  if(UI.aPack)ks=ks.filter(k=>k.pack===UI.aPack);
  if(q)ks=ks.filter(k=>[k.name,k.parent,k.grade,k.allergy,k.school].join(' ').toLowerCase().includes(q));
  ks.sort(sortKids);
  const card=k=>{const b=B[k.id]||ZB;const dd=kidDays(k);
    return`<button class="kid${k.active===false?' inactive':''}" data-act="kidEdit" data-k="${k.id}"><div class="top1"><span class="nm">${esc(k.name)}</span>${pk(k.pack)}</div>
    <span class="sc">${esc(k.school||'-')} · ${esc(k.grade||'-')}${k.parent?' · Ortu: '+esc(k.parent):''}</span>
    ${k.allergy&&k.allergy!=='-'?`<span class="alg" style="font-size:13px">${I('alert',14)}<span>Req/Alergi: ${esc(k.allergy)}</span></span>`:`<span class="muted" style="font-size:12.5px">Req/Alergi: –</span>`}
    <span class="days" aria-label="Hari langganan">${[1,2,3,4,5,6].map(i=>`<i class="${dd.includes(i)?'on':''}" title="${DAYN[i]}">${DAYS1[i]}</i>`).join('')}${k.price?`<span class="pill" style="margin-left:6px">${rp(k.price)}/porsi</span>`:''}${k.active===false?'<span class="pill" style="margin-left:6px">Nonaktif</span>':''}</span>
    <span class="ft"><span>Saldo <b class="num ${b.bal<0?'neg':''}">${rp(b.bal)}</b></span>${stPill(b)}</span></button>`};
  return`<div class="vh"><div><h1>Database Anak & Langganan</h1><p>${tot} anak terdaftar. Klik kartu untuk ubah profil, kemasan default, hari langganan, dan harga khusus.</p></div>
    <div class="row"><button class="btn" data-act="kidImport">${I('upload',16)}Import massal</button><button class="btn pri" data-act="kidNew">${I('plus',16)}Tambah anak</button></div></div>
  <div class="schstrip" style="margin-bottom:12px;padding:0">${(()=>{const c={};kidsArr().filter(k=>k.active!==false).forEach(k=>c[k.school||'-']=(c[k.school||'-']||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]||cmpN(a[0],b[0])).map(([sc,n])=>`<a class="schc${UI.aSchool===sc?' on':''}" href="javascript:void 0" data-act="aSch" data-s="${esc(sc)}"><b class="num">${n}</b><span>${esc(sc)}</span></a>`).join('')})()}</div>
  <div class="tool"><div class="search">${I('search',16)}<input class="inp" id="aQ" data-bind="aQ" value="${esc(UI.aQ)}" placeholder="Cari nama, kelas, ortu, alergi…" aria-label="Cari anak"></div>
    <select class="inp" id="aSchool" data-bind="aSchool" aria-label="Sekolah"><option value="">Semua sekolah</option>${schools().map(s=>`<option${s===UI.aSchool?' selected':''}>${esc(s)}</option>`).join('')}</select>
    <select class="inp" id="aPack" data-bind="aPack" aria-label="Kemasan"><option value="">Semua kemasan</option>${packs().map(s=>`<option${s===UI.aPack?' selected':''}>${esc(s)}</option>`).join('')}</select>
    <select class="inp" id="aShow" data-bind="aShow" aria-label="Status"><option value="active"${UI.aShow==='active'?' selected':''}>Aktif</option><option value="inactive"${UI.aShow==='inactive'?' selected':''}>Nonaktif</option><option value="all"${UI.aShow==='all'?' selected':''}>Semua</option></select>
    <span class="muted">${ks.length} ditampilkan</span></div>
  ${ks.length?`<div class="kids">${ks.map(card).join('')}</div>`:`<div class="card">${tot?empty('Tidak ada yang cocok','Ubah pencarian atau filter.'):empty('Belum ada data anak','Tambah satu per satu atau tempel daftar dari Excel lewat Import massal.',`<div class="row"><button class="btn pri" data-act="kidNew">${I('plus',16)}Tambah anak</button><button class="btn" data-act="kidImport">Import massal</button></div>`)}</div>`}`;
};

/* ----- Menu ----- */
VIEWS.menu=()=>{
  const u=menuUsage();let ms=menusArr();const tot=ms.length;
  if(UI.mDay)ms=ms.filter(m=>m.day===UI.mDay);
  const q=UI.mQ.trim().toLowerCase();if(q)ms=ms.filter(m=>(m.name+' '+(m.notes||'')).toLowerCase().includes(q));
  const ord=d=>{const i=DAYN.indexOf(d);return i<1?9:i};
  ms.sort((a,b)=>(a.week||0)-(b.week||0)||ord(a.day)-ord(b.day)||cmpN(a.name,b.name));
  const weeks={};ms.forEach(m=>(weeks[m.week||0]=weeks[m.week||0]||[]).push(m));
  const card=m=>{const x=u[m.id];const parts=dishParts(m.name);const tone=DAYC[m.day]||'lav';const mi=parts.length>1&&/^nasi$/i.test(parts[0])?1:0;
    return`<article class="mcard"><header class="mh t-${tone}"><span class="md">${esc(m.day||'Bebas')}</span>${m.week?`<span class="mw">M${m.week}</span>`:''}</header>
    <ul class="mlist">${parts.map((p,i)=>`<li${i===mi?' class="main"':''}>${esc(p)}</li>`).join('')}</ul>
    ${m.notes?`<p class="mnote">${I('alert',13)}<span>${esc(m.notes)}</span></p>`:''}

/* ----- Keuangan ----- */
function monthStats(mo){
  let cash=0,refund=0,charge=0,porsi=0;
  for(const p of Object.values(S.pays))if((p.date||'').startsWith(mo)){if(p.type==='topup')cash+=Number(p.amount)||0;if(p.type==='refund')refund+=Number(p.amount)||0}
  for(const d of Object.values(S.days))if(d.date.startsWith(mo))for(const e of Object.values(d.entries||{}))if(e.status!=='cancelled'){charge+=Number(e.price)||0;porsi++}
  let out=0,inc=0;const cat={};
  for(const x of Object.values(S.exps))if((x.date||'').startsWith(mo)){const a=Number(x.amount)||0;if(x.type==='in')inc+=a;else{out+=a;cat[x.category||'Lain-lain']=(cat[x.category||'Lain-lain']||0)+a}}
  return{cash,refund,charge,porsi,out,inc,cat};
}

let M=null;
function openM(cfg){M=cfg;M.st=M.st||{};$('#ov').hidden=false;document.body.classList.add('modal-open');drawM(true)}
function drawM(first){
  if(!M)return;const a=document.activeElement;const fid=!first&&a&&a.id&&$('#dlg').contains(a)?a.id:null;let ss=null;try{ss=fid?a.selectionStart:null}catch(e){}
  const sc=$('#dlg-b').scrollTop;const ls=[...$('#dlg-b').querySelectorAll('.picklist')].map(e=>e.scrollTop);
  $('#dlg-t').textContent=M.title;$('#dlg').className='dlg'+(M.wide?' wide':'');
  $('#dlg-b').innerHTML=M.body();
  $('#dlg-f').innerHTML=M.foot?M.foot():`${M.left||''}<span style="flex:1"></span><button type="button" class="btn ghost" data-act="closeM">Batal</button><button class="btn ${M.danger?'danger':'pri'}" type="submit">${M.ok||'Simpan'}</button>`;
  if(first){$('#dlg-b').scrollTop=0;setTimeout(()=>{const f=$('#dlg-b [autofocus]')||$('#dlg-b input,#dlg-b select');f&&f.focus()},30)}
  else{$('#dlg-b').scrollTop=sc;$('#dlg-b').querySelectorAll('.picklist').forEach((e,i)=>{if(ls[i]!=null)e.scrollTop=ls[i]});if(fid){const e=document.getElementById(fid);if(e){e.focus();if(ss!=null)try{e.setSelectionRange(ss,ss)}catch(x){}}}}
}
function closeM(){M=null;$('#ov').hidden=true;document.body.classList.remove('modal-open')}
$('#dlgf').addEventListener('submit',async e=>{e.preventDefault();if(!M||!M.submit)return;const fd=new FormData(e.target);const o={};for(const[k,v]of fd.entries())o[k]=v;const btn=$('#dlg-f [type=submit]');if(btn)btn.disabled=true;let r;try{r=await M.submit(o,fd)}finally{if(btn)btn.disabled=false}if(r!==false)closeM()});
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});
function ask(title,text,ok,fn){openM({title,danger:true,ok,body:()=>`<p class="lead">${text}</p>`,submit:async()=>{await fn()}})}
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),3400)}
function copyText(txt,label){
  const done=()=>toast((label||'Teks')+' disalin','ok');
  const fallback=()=>openM({title:'Salin teks',body:()=>`<textarea class="inp" rows="14" readonly id="cpy">${esc(txt)}</textarea><p class="hint">Teks sudah terpilih. Tekan Ctrl+C (atau tahan lalu Salin di HP).</p>`,foot:()=>`<button type="button" class="btn pri" data-act="closeM">Selesai</button>`});
  try{navigator.clipboard.writeText(txt).then(done,()=>{fallback();setTimeout(()=>{const c=$('#cpy');c&&c.select()},60)})}catch(e){fallback();setTimeout(()=>{const c=$('#cpy');c&&c.select()},60)}
}

/* ----- PDF labels ----- */
function buildPdf(){
  if(!window.jspdf){toast('Library PDF belum termuat. Coba lagi sebentar.','err');return null}
  const [w,h]=lsize();const items=labelItems().filter(x=>!UI.lSkip[UI.lDate+'|'+x.k]);if(!items.length)return null;
  const {jsPDF}=window.jspdf;const or=w>=h?'landscape':'portrait';
  const doc=new jsPDF({orientation:or,unit:'mm',format:[w,h]});
  const s=Math.min(w/58,h/40),m=1.4*s+1.5,PT=0.3528,W=w-2*m,ox=clampN(UI.lOx,-10,10,0),oy=clampN(UI.lOy,-10,10,0);
  const X=v=>v+ox,Y=v=>v+oy,fs=f=>doc.setFontSize(f),tw=t=>doc.getTextWidth(t),bold=b=>doc.setFont('helvetica',b?'bold':'normal');
  const clip=(t,max)=>{t=String(t);if(tw(t)<=max)return t;while(t.length>1&&tw(t+'...')>max)t=t.slice(0,-1);return t+'...'};
  const cp=clampN(UI.lCopies,1,5,1);const brand=String(S.cfg.name||'').toUpperCase(),dl=dateLbl(UI.lDate);
  let first=true;
  items.forEach(x=>{for(let c=0;c<cp;c++){
    if(!first)doc.addPage([w,h],or);first=false;
    doc.setTextColor(0);doc.setDrawColor(0);doc.setLineWidth(0.4);doc.roundedRect(X(0.8),Y(0.8),w-1.6,h-1.6,1.2,1.2,'S');doc.setLineWidth(0.25);
    let y=m;
    /* header */
    const hf=6*s,hh=hf*PT;bold(1);fs(hf);doc.text(clip(brand,W*0.62),X(m),Y(y+hh));bold(0);doc.text(dl,X(w-m),Y(y+hh),{align:'right'});
    y+=hh+0.8*s;doc.line(X(m),Y(y),X(w-m),Y(y));y+=0.8*s;
    /* name + kemasan code */
    bold(1);let nf=13*s;fs(nf);const nW=W;while(tw(x.name)>nW&&nf>8){nf-=0.25;fs(nf)}let nh=nf*PT;
    if(tw(x.name)>nW){const nl=doc.splitTextToSize(x.name,nW).slice(0,2);const lh=nf*PT*1.02;nl.forEach((l,j)=>doc.text(l,X(m),Y(y+nh*0.85+j*lh)));nh=nf*PT+lh*(nl.length-1)}
    else doc.text(x.name,X(m),Y(y+nh*0.85));
    y+=nh+0.9*s;
    /* sekolah + grade (besar) */
    const gf=Math.max(9.5*s,7.2);const sch=String(x.school||'-').toUpperCase(),gr=String(x.grade||'').toUpperCase();
    bold(0);fs(gf);const gh=gf*PT+1.4*s;const gw=gr?tw(gr):0;
    if(gr){doc.text(gr,X(w-m),Y(y+gh/2+gf*PT*0.36),{align:'right'})}
    let sf=gf;const sW=W-(gr?gw+1.5*s:0);fs(sf);while(tw(sch)>sW&&sf>6){sf-=0.25;fs(sf)}
    let sh=gh;
    if(tw(sch)>sW){fs(sf);const ls=doc.splitTextToSize(sch,sW).slice(0,2);const lh=sf*PT*1.05;sh=Math.max(gh,ls.length*lh+0.3*s);const top=y+sh/2-(ls.length*lh)/2;ls.forEach((l,j)=>doc.text(l,X(m),Y(top+(j+0.82)*lh)))}
    else doc.text(sch,X(m),Y(y+gh/2+sf*PT*0.36));
    y+=sh+1*s;
    /* request / alergi (selalu terbaca) */
    const r=algText(x).toUpperCase();let reqTop;
    if(r){
      const p=0.9*s+0.2,iw=W-2*p,lab='! REQ/ALERGI: ';let rf=Math.max(7.6*s,6.6),ls,lh,maxL,lw;
      const avail=h-m-y-0.6*s;
      const wrap=(t,first,rest)=>{const out=[];let cur='',lim=first;t.split(/\s+/).forEach(wd=>{const nx=cur?cur+' '+wd:wd;if(tw(nx)<=lim||!cur)cur=nx;else{out.push(cur);cur=wd;lim=rest}});if(cur)out.push(cur);return out};
      for(;;){fs(rf);bold(1);lw=tw(lab);bold(0);lh=rf*PT*1.13;maxL=Math.max(1,Math.min(4,Math.floor((avail-2*p)/lh)));ls=wrap(r,iw-lw,iw);if(ls.length<=maxL||rf<=5.6)break;rf-=0.3}
      if(ls.length>maxL){ls=ls.slice(0,maxL);let la=ls[maxL-1];const lim=maxL===1?iw-lw:iw;while(la.length>1&&tw(la+'...')>lim)la=la.slice(0,-1);ls[maxL-1]=la+'...'}
      const bh=ls.length*lh+2*p-0.2*s;reqTop=h-m-bh;
      doc.setLineWidth(0.5);doc.roundedRect(X(m),Y(reqTop),W,bh,0.7,0.7,'S');doc.setLineWidth(0.25);
      const by0=reqTop+p+rf*PT*0.85;bold(1);fs(rf);doc.text(lab,X(m+p),Y(by0));bold(0);
      ls.forEach((l,j)=>doc.text(l,X(m+p+(j===0?lw:0)),Y(by0+j*lh)));
    }else{
      const ff=Math.max(5.8*s,5.4);reqTop=h-m-ff*PT-0.9*s;doc.line(X(m),Y(reqTop),X(w-m),Y(reqTop));bold(0);fs(ff);doc.text('REQ/ALERGI: -',X(m),Y(h-m-0.2*s));
    }
    /* catatan khusus jadwal: garis sendiri */
    const nt=noteText(x).toUpperCase();
    if(nt){const tf=Math.max(5.8*s,5.4),cf=Math.max(7*s,6.4),lh=cf*PT*1.13,g=0.8*s;bold(1);fs(tf);const tag='CATATAN',tW=tw(tag)+1.6*s;
      bold(0);fs(cf);let ls=doc.splitTextToSize(nt,W-tW-1.2*s);if(ls.length>2){ls=ls.slice(0,2);let la=ls[1];while(la.length>1&&tw(la+'...')>W-tW-1.2*s)la=la.slice(0,-1);ls[1]=la+'...'}
      const bh=ls.length*lh+1.2*s,top=reqTop-g-bh;
      doc.setLineDashPattern([0.8,0.6],0);doc.setLineWidth(0.35);doc.line(X(m),Y(top),X(w-m),Y(top));doc.line(X(m),Y(top+bh),X(w-m),Y(top+bh));doc.setLineDashPattern([],0);doc.setLineWidth(0.25);
      const th=tf*PT+1*s;doc.setFillColor(0);doc.roundedRect(X(m),Y(top+0.6*s),tW,th,0.4,0.4,'F');doc.setTextColor(255);fs(tf);bold(1);doc.text(tag,X(m+0.8*s),Y(top+0.6*s+th/2+tf*PT*0.36));doc.setTextColor(0);
      bold(0);fs(cf);ls.forEach((l,j)=>doc.text(l,X(m+tW+1.2*s),Y(top+0.6*s+cf*PT*0.85+j*lh)));
      reqTop=top;}
    /* menu di sisa ruang */
    if(UI.lMenu&&x.menu){const room=reqTop-0.6*s-y;let mf=Math.max(7.3*s,6.5),lh,ls;bold(0);
      for(;;){fs(mf);lh=mf*PT*1.13;ls=doc.splitTextToSize(x.menu.toUpperCase(),W);if(ls.length*lh<=room||mf<=4.6)break;mf-=0.2}
      const maxL=Math.floor(room/lh);if(maxL>0){if(ls.length>maxL){ls=ls.slice(0,maxL);let la=ls[maxL-1];while(la.length>1&&tw(la+'...')>W)la=la.slice(0,-1);ls[maxL-1]=la+'...'}ls.forEach((l,j)=>doc.text(l,X(m),Y(y+mf*PT*0.85+j*lh)))}}
  }});
  return{doc,name:`label-${UI.lDate}-${w}x${h}mm`,n:items.length*cp};
}
async function makePdf(){const r=buildPdf();if(!r)return;r.doc.save(r.name+'.pdf');toast('PDF label tersimpan','ok')}

/* direct print: labels rendered as HTML pages sized exactly to the sticker */
function fitNames(root){(root||document).querySelectorAll('.lbl .lnn').forEach(n=>{n.removeAttribute('style');n.classList.remove('wrap2');let f=parseFloat(getComputedStyle(n).fontSize)||16;const min=Math.max(f*0.62,10);let g=0;while(n.scrollWidth>n.clientWidth+0.5&&f>min&&g++<60){f-=0.25;n.style.fontSize=f+'px'}if(n.scrollWidth>n.clientWidth+0.5)n.classList.add('wrap2')})}
function fitMenus(root){fitNames(root);(root||document).querySelectorAll('.lbl .lm').forEach(el=>{
  const L=el.closest('.lbl');L.classList.remove('tight');el.removeAttribute('style');const sc=L.querySelector('.lsc');if(sc)sc.removeAttribute('style');
  if(!el.textContent.trim())return;
  const base=parseFloat(getComputedStyle(el).fontSize)||10;
  const shrink=min=>{let f=base,g=0;el.style.fontSize=f+'px';while(el.scrollHeight>el.clientHeight+0.5&&f>min&&g++<80){f-=0.25;el.style.fontSize=f+'px'}return el.scrollHeight<=el.clientHeight+0.5};
  if(shrink(Math.max(6.6,base*0.72)))return;
  /* rapatkan: nama sekolah 1 baris, catatan & alergi sedikit lebih kecil */
  L.classList.add('tight');
  if(sc){let f=parseFloat(getComputedStyle(sc).fontSize),g=0;const lh=()=>parseFloat(getComputedStyle(sc).lineHeight)||f*1.05;while(sc.scrollHeight>lh()*1.3&&f>6.5&&g++<60){f-=0.25;sc.style.fontSize=f+'px'}}
  shrink(Math.max(5,base*0.45))})}
function printLabels(onlyFirst){
  const [w,h]=lsize();let items=labelItems().filter(x=>!UI.lSkip[UI.lDate+'|'+x.k]);if(!items.length)return;
  if(onlyFirst===true)items=items.slice(0,2);
  const s=Math.min(w/58,h/40),cp=onlyFirst===true?1:clampN(UI.lCopies,1,5,1),ox=clampN(UI.lOx,-10,10,0),oy=clampN(UI.lOy,-10,10,0);
  const k=clampN(UI.lScale,50,100,90)/100;
  const o=UI.lOrient||'portrait',rot=o==='rotate';const pw=rot?h:w,ph=rot?w:h;
  /* page box is a hair smaller than the paper so rounding never spills onto an extra (blank) page */
  const bw=pw-0.6,bh=ph-0.8;
  const vw=rot?h*k:w*k,vh=rot?w*k:h*k;const cx=(bw-vw)/2+ox,cy=(bh-vh)/2+oy;
  const tf=`translate(${cx.toFixed(2)}mm,${cy.toFixed(2)}mm)`+(rot?` translate(${(h*k).toFixed(2)}mm,0) rotate(90deg)`:'')+` scale(${k})`;
  let html='';items.forEach(x=>{for(let c=0;c<cp;c++)html+=`<div class="pg" style="width:${bw.toFixed(2)}mm;height:${bh.toFixed(2)}mm"><div class="lbl" style="width:${w}mm;height:${h}mm;--s:${s.toFixed(3)};transform:${tf};transform-origin:0 0">${labelInner(x)}</div></div>`});
  $('#printArea').innerHTML=html;
  const size=o==='landscape'?`${w}mm ${h}mm`:o==='rotate'?`${pw}mm ${ph}mm`:'auto';
  $('#pageStyle').textContent=`@page{size:${size};margin:0}@media print{html,body{margin:0!important;padding:0!important;height:auto!important;min-height:0!important;background:#fff!important}body::before{display:none!important}}`;
  const pa=$('#printArea');pa.style.cssText='display:block;position:fixed;left:-9999px;top:0';fitMenus(pa);pa.style.cssText='';

}

      <label class="f">Ukuran default (semua perangkat)<select class="inp" name="labelSize">${Object.keys(allSizes()).sort((a,b)=>allSizes()[a][0]-allSizes()[b][0]||allSizes()[a][1]-allSizes()[b][1]).map(k=>`<option value="${k}"${k===defSize()?' selected':''}>${k.replace('x',' × ')} mm</option>`).join('')}</select></label>
      <p class="hint" style="margin:10px 0 6px">Ukuran tambahan untuk printer lain</p>
      ${(S.cfg.labelSizes||[]).filter(k=>!SIZES[k]).map(k=>`<div class="li"><div class="t"><b>${k.replace('x',' × ')} mm</b></div><button type="button" class="btn sm" data-act="delSize" data-k="${k}">${I('trash',14)}Hapus</button></div>`).join('')||'<p class="hint">Belum ada.</p>'}
      <div class="row" style="margin-top:8px"><input class="inp" id="nsW" type="number" min="20" max="150" placeholder="Lebar mm" style="width:110px"><span>×</span><input class="inp" id="nsH" type="number" min="15" max="150" placeholder="Tinggi mm" style="width:110px"><button type="button" class="btn" data-act="addSize">${I('plus',14)}Tambah ukuran</button></div>
    </div>
    <div class="card pad" style="box-shadow:none;background:var(--sunk)"><div class="sec-h"><h2>Backup data</h2></div><p class="hint" style="margin-bottom:10px">Simpan seluruh data ke file JSON, atau pulihkan dari file backup. Import menimpa data dengan ID yang sama.</p>
    <div class="row"><button type="button" class="btn" data-act="bkExport">${I('download',16)}Export backup</button><button type="button" class="btn" data-act="bkImport">${I('upload',16)}Import backup</button></div></div>
`},
    submit:async o=>{const ok=await put('config','main',{...S.cfg,labelSize:o.labelSize||S.cfg.labelSize,name:o.name.trim()||DEFAULT_CFG.name,tagline:o.tagline.trim(),price:Number(o.price)||DEFAULT_CFG.price,lowPorsi:Number(o.lowPorsi)||0});if(ok)toast('Pengaturan disimpan','ok');return ok}});
}

/* ---------- actions ---------- */
const ACT={
  closeM, settings:settingsForm, go:d=>go(d.t),
  goDay:d=>{UI.jDate=d.d;go('jadwal');schedule()},
  goLabel:d=>{UI.lDate=d.d;go('label');schedule()},
  jSel:d=>{UI.jDate=d.d;schedule()},
  jWeek:d=>{UI.jDate=addDays(UI.jDate,Number(d.n));schedule()},
  weekGen:d=>{if(!menusArr().length&&!activeKids().length){toast('Tambah data anak dan menu dulu','err');return}weekForm(d.d)},
  assign:d=>assignForm(d.d),
  est:async d=>{const dd=dayClone(d.d);if(!dd.entries[d.k])return;dd.entries[d.k].status=d.s;await put('days',d.d,dd)},
  eEdit:d=>entryForm(d.d,d.k),
  jumpSch:d=>{const g=[...document.querySelectorAll('.grp')].find(x=>x.dataset.sch===d.s);if(g){const y=g.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y,behavior:'smooth'})}},
  aSch:d=>{UI.aSchool=UI.aSchool===d.s?'':d.s;schedule()},
  setDefSize:async()=>{const k=sizeKeyNow();const list=[...new Set([...(S.cfg.labelSizes||[]),...(SIZES[k]?[]:[k])])];if(await put('config','main',{...S.cfg,labelSize:k,labelSizes:list})){UI.lSize='';toast('Ukuran default: '+k.replace('x',' × ')+' mm','ok')}},
  delSize:async d=>{const list=(S.cfg.labelSizes||[]).filter(k=>k!==d.k);const def=S.cfg.labelSize===d.k?'80x50':S.cfg.labelSize;if(await put('config','main',{...S.cfg,labelSizes:list,labelSize:def})){M&&drawM();toast('Ukuran '+d.k.replace('x',' × ')+' dihapus','ok')}},
  addSize:async()=>{const w=clampN($('#nsW').value,20,150,0),h=clampN($('#nsH').value,15,150,0);if(!w||!h){toast('Isi lebar dan tinggi (mm)','err');return}const k=w+'x'+h;if(SIZES[k]||(S.cfg.labelSizes||[]).includes(k)){toast('Ukuran itu sudah ada','err');return}if(await put('config','main',{...S.cfg,labelSizes:[...(S.cfg.labelSizes||[]),k]})){M&&drawM();toast('Ukuran '+w+' × '+h+' mm ditambahkan','ok')}},
  jPack:d=>{UI.jPack=UI.jPack===d.v?'':d.v;schedule()},
  ePack:async d=>{const dd=dayClone(d.d);const e=dd.entries[d.k];if(!e)return;e.pack=(e.pack||'Plastic Box')==='Lunch Box'?'Plastic Box':'Lunch Box';if(await put('days',d.d,dd))toast('Kemasan '+(e.name||'')+' hari ini: '+e.pack,'ok')},
  eDel:d=>{const x=info(d.k,S.days[d.d].entries[d.k]);ask('Hapus dari jadwal?',`<b>${esc(x.name)}</b> dihapus dari jadwal ${esc(fmtD(d.d))} dan saldonya tidak dipotong. Gunakan status <b>Batal</b> jika ingin tetap tercatat.`,'Hapus',async()=>{const dd=dayClone(d.d);delete dd.entries[d.k];if(Object.keys(dd.entries).length)await put('days',d.d,dd);else await del('days',d.d)})},
  allDone:async d=>{const dd=dayClone(d.d);let n=0;Object.values(dd.entries).forEach(e=>{if(e.status==='scheduled'){e.status='delivered';n++}});if(!n){toast('Semua porsi sudah ditandai');return}if(await put('days',d.d,dd))toast(n+' porsi ditandai terkirim','ok')},
  dayCopy:d=>copyText(dayRecap(d.d),'Rekap'),
  dayClear:d=>ask('Hapus jadwal hari ini?',`Semua porsi pada ${esc(fmtD(d.d))} dihapus dan saldo anak dikembalikan. Tindakan ini tidak bisa dibatalkan.`,'Hapus jadwal',async()=>{await del('days',d.d);toast('Jadwal dihapus','ok')}),
  kidNew:()=>kidForm(null), kidEdit:d=>kidForm(d.k), kidImport,
  kidDel:d=>{const k=S.kids[d.k];ask('Hapus anak?',`Data <b>${esc(k.name)}</b> dihapus. Riwayat jadwal tetap tersimpan dengan nama lama. Untuk berhenti langganan sementara, cukup nonaktifkan.`,'Hapus anak',async()=>{await del('kids',d.k);toast('Anak dihapus','ok')})},
  menuNew:()=>menuForm(null), menuEdit:d=>menuForm(d.m), menuAssign:d=>{let dt=TODAY;const tgt=S.menus[d.m].day;if(tgt){const ti=DAYN.indexOf(tgt);for(let i=0;i<7;i++){const c=addDays(TODAY,i);if(parseD(c).getDay()===ti){dt=c;break}}}assignForm(dt,d.m)},
  menuDel:d=>ask('Hapus menu?','Menu dihapus dari daftar ide. Jadwal lama tetap menyimpan nama menunya.','Hapus menu',async()=>{await del('menus',d.m);toast('Menu dihapus','ok')}),
  mDay:d=>{UI.mDay=d.v;schedule()},
  kTab:d=>{UI.kTab=d.v;schedule()},
  expNew:()=>expForm(null),
  expCat:(d,t)=>{const i=$('#expCatIn');if(i)i.value=d.v;t.parentElement.querySelectorAll('.btn').forEach(b=>b.classList.toggle('pri',b===t))}, expEdit:d=>expForm(d.x),
  expDel:d=>{const x=S.exps[d.x];ask('Hapus transaksi?',`${esc(x.category||'')} ${rp(x.amount)} pada ${shortD(x.date)} dihapus.`,'Hapus',async()=>{await del('exps',d.x);toast('Transaksi dihapus','ok')})},
  payNew:d=>payForm(d.k), payEdit:d=>payForm(null,d.p),
  payDel:d=>{const p=S.pays[d.p];ask('Hapus pembayaran?',`${PAYT[p.type]} ${rp(p.amount)} untuk <b>${esc((S.kids[p.kidId]||{}).name||'')}</b> pada ${shortD(p.date)} dihapus dan saldo dihitung ulang.`,'Hapus',async()=>{await del('pays',d.p);toast('Pembayaran dihapus','ok')})},
  payQuick:d=>{const a=$('#pAmt');if(a){a.value=d.v;a.focus()}},
  payOwe:()=>{const k=$('#pKid').value;if(!k){toast('Pilih anak dulu','err');return}const b=(bal()[k]||ZB).bal;if(b>=0){toast('Saldo anak ini tidak minus');return}$('#pAmt').value=-b},
  ledger:d=>ledgerView(d.k), bill:d=>billModal(d.k),
  copyM:()=>copyText(M.st.txt,'Pesan'),
  csv:csvExport, pdf:makePdf, print:()=>printLabels(false), printTest:()=>printLabels(true),
  lSkip:d=>{UI.lSkip[d.key]=!UI.lSkip[d.key];schedule()},
  asTog:(d,t)=>{M.st.sel[d.k]=t.checked;const st=M.st,m=S.menus[st.menuId];const ids=Object.keys(st.sel).filter(k=>st.sel[k]);const c=$('#asCount');if(c)c.innerHTML=`<b>${ids.length}</b> anak dipilih · estimasi ${rp(ids.filter(k=>S.kids[k]).reduce((s,k)=>s+priceFor(S.kids[k],m),0))}`},
  asAll:()=>{const q=M.st.q.trim().toLowerCase();kidsArr().filter(k=>k.active!==false&&(!q||(k.name+' '+k.school+' '+k.grade).toLowerCase().includes(q))).forEach(k=>M.st.sel[k.id]=true);drawM()},
  asNone:()=>{M.st.sel={};drawM()},
  asSub:()=>{const w=parseD(M.st.date).getDay();M.st.sel={};activeKids().forEach(k=>{if(kidDays(k).includes(w))M.st.sel[k.id]=true});drawM()},
  bkExport:()=>saveFile(`backup-one-two-kitchen-${TODAY}.json`,JSON.stringify({app:'one-two-kitchen',v:1,at:new Date().toISOString(),kids:S.kids,menus:S.menus,days:S.days,pays:S.pays,exps:S.exps,cfg:S.cfg},null,1)),
  bkImport:()=>$('#fileIn').click(),
  logout:async()=>{closeM();await sb.auth.signOut()},
  teamAdd:async()=>{const e=($('#teamE').value||'').trim().toLowerCase(),r=$('#teamR').value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Email tidak valid','err');return}
    try{await sbq(sb.from('otk_members').upsert({email:e,role:r}));M.st.team=await loadTeam();drawM();toast(e+' ditambahkan ke tim','ok')}catch(x){toast('Gagal menambah anggota','err')}},
  teamDel:async d=>{try{await sbq(sb.from('otk_members').delete().eq('email',d.e));M.st.team=await loadTeam();drawM();toast(d.e+' dihapus dari tim','ok')}catch(x){toast('Gagal menghapus','err')}},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(!f)return;if(t.tagName==='A')e.preventDefault();f(t.dataset,t,e)});
function onField(e){
  const t=e.target;
  if(t.dataset.bind){const k=t.dataset.bind;UI[k]=t.type==='checkbox'?t.checked:t.value;if(k==='jDate'&&!UI.jDate)UI.jDate=TODAY;if(k==='lDate'&&!UI.lDate)UI.lDate=TODAY;if(k==='kMonth'&&!UI.kMonth)UI.kMonth=TODAY.slice(0,7);if(PKEYS.includes(k))savePrint();schedule();return}
  if(t.dataset.m&&M){const v=t.type==='checkbox'?t.checked:t.value;setPath(M.st,t.dataset.m,v);if(t.dataset.redraw!==undefined&&(e.type==='change'||t.type==='text'||t.type==='search'||t.tagName==='TEXTAREA'||!t.type)){if(M.onChange)M.onChange(t.dataset.m);if(t.id!=='impTxt'||e.type==='input')drawM()}return}
}
document.addEventListener('input',e=>{const t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date'||t.type==='month')return;onField(e)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.chg==='dayMenu'){const dd=dayClone(t.dataset.d);const m=S.menus[t.value];dd.menuId=t.value;dd.menuName=m?m.name:'';put('days',t.dataset.d,dd).then(ok=>ok&&toast('Menu diganti','ok'));return}
  if(t.type==='checkbox'&&t.dataset.act)return;
  onField(e)});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||typeof o!=='object'||!o.kids)throw 0;
    const list=[];COLS.forEach(c=>Object.entries(o[c]||{}).forEach(([id,d])=>{if(/^[A-Za-z0-9_\-.~:@+]+$/.test(id)&&d&&typeof d==='object')list.push([c,id,d])}));
    closeM();ask('Import backup?',`File berisi ${Object.keys(o.kids||{}).length} anak, ${Object.keys(o.menus||{}).length} menu, ${Object.keys(o.days||{}).length} hari jadwal dan ${Object.keys(o.pays||{}).length} pembayaran. Data dengan ID yang sama akan ditimpa.`,'Import',async()=>{const ok=await putMany(list);if(ok&&o.cfg)await put('config','main',{...DEFAULT_CFG,...o.cfg});if(ok)toast('Backup dipulihkan','ok')});
  }catch(x){toast('File bukan backup One Two Kitchen yang valid','err')}});

/* ---------- routing ---------- */
function go(t){if(!TABS.some(x=>x[0]===t))t='dashboard';UI.tab=t;try{history.replaceState(null,'','#'+t)}catch(e){}schedule();try{window.scrollTo(0,0)}catch(e){}}
function route(){let h='';try{h=location.hash.slice(1)}catch(e){}UI.tab=TABS.some(t=>t[0]===h)?h:'dashboard';schedule()}
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
$('#logoIc').innerHTML=I('food',22);$('#gearBtn').innerHTML=I('gear',19);$('#dlgX').innerHTML=I('x',18);
const td=parseD(TODAY);$('#todayLbl').innerHTML=I('cal',14)+'<span>Hari ini: '+td.getDate()+' '+MON[td.getMonth()]+' '+td.getFullYear()+'</span>';
route();
/* ---------- auth & boot ---------- */
let authMode='in',chan=null,subOnce=false;
function showAuth(msg){
  const a=$('#auth');a.hidden=false;closeM();
  a.innerHTML=`<form class="card authc" id="authF" novalidate>
    <div class="authb"><span class="logo" style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center">${I('food',24)}</span><div><h1>One Two Kitchen</h1><span class="muted">Daily Kid Catering Management</span></div></div>
    ${msg?`<div class="banner ${msg.t||'info'}" style="margin:0">${esc(msg.m)}</div>`:''}
    <label class="f">Email<input class="inp" type="email" id="auE" autocomplete="email" required></label>
    <label class="f">Password<input class="inp" type="password" id="auP" autocomplete="${authMode==='in'?'current-password':'new-password'}" minlength="6" required></label>
    <button class="btn pri" type="submit" id="auB">${authMode==='in'?'Masuk':'Buat akun'}</button>
    <p class="hint">${authMode==='in'?'Belum punya akun? <button type="button" class="linkbtn" id="auT">Daftar dengan email</button>':'Sudah punya akun? <button type="button" class="linkbtn" id="auT">Masuk</button>'}</p>
    <p class="hint">Hanya email yang sudah didaftarkan pemilik di Pengaturan → Tim yang bisa membuka data.</p></form>`;
  $('#auT').onclick=()=>{authMode=authMode==='in'?'up':'in';showAuth()};
  setTimeout(()=>$('#auE')&&$('#auE').focus(),30);
  $('#authF').onsubmit=async e=>{e.preventDefault();const em=$('#auE').value.trim().toLowerCase(),pw=$('#auP').value;
    if(!em||pw.length<6){showAuthErr('Isi email dan password (minimal 6 karakter).');return}
    const b=$('#auB');b.disabled=true;b.textContent='Memproses…';
    try{
      if(authMode==='in'){const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
        if(error){b.disabled=false;b.textContent='Masuk';showAuthErr(/confirm/i.test(error.message)?'Email belum dikonfirmasi. Buka email dari Supabase lalu klik link konfirmasi.':'Email atau password salah.');return}
        start(data.session);
      }else{const {data,error}=await sb.auth.signUp({email:em,password:pw});
        if(error){b.disabled=false;b.textContent='Buat akun';showAuthErr(error.message);return}
        if(data.session)start(data.session);else{authMode='in';showAuth({t:'info',m:'Akun dibuat. Cek email '+em+' dan klik link konfirmasi, lalu kembali ke sini dan masuk.'})}
      }
    }catch(x){b.disabled=false;b.textContent=authMode==='in'?'Masuk':'Buat akun';showAuthErr('Tidak bisa terhubung ke server. Periksa internet.')}
  };
}
function showAuthErr(m){const f=$('#authF');let x=f.querySelector('.banner.err-a');if(!x){x=document.createElement('div');x.className='banner warn err-a';x.style.margin='0';f.insertBefore(x,f.children[1])}x.textContent=m}
async function startOpen(){
  S.canWrite=true;myRole='owner';
  try{await loadAll();S.mode='online'}catch(e){S.mode='offline';toast('Data gagal dimuat. Periksa internet lalu muat ulang.','err')}
  if(!chan)chan=sb.channel('otk-docs').on('postgres_changes',{event:'*',schema:'public',table:'otk_docs'},applyChange).subscribe(st=>{
    if(st==='SUBSCRIBED'){if(subOnce)loadAll().catch(()=>{});subOnce=true;S.mode='online'}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')S.mode='offline';
    schedule()});
  me={email:''};schedule();
}
async function start(session){
  me=session.user;
  let mem=[];
  try{mem=await sbq(sb.from('otk_members').select('email,role').eq('email',(me.email||'').toLowerCase()))}catch(e){}
  if(!mem.length){const em=me.email;await sb.auth.signOut();showAuth({t:'warn',m:'Email '+em+' belum diizinkan. Minta pemilik menambahkan email ini di Pengaturan → Tim, lalu masuk lagi.'});return}
  myRole=mem[0].role;S.canWrite=true;$('#auth').hidden=true;$('#auth').innerHTML='';
  try{await loadAll();S.mode='online'}catch(e){S.mode='offline';toast('Data gagal dimuat. Periksa internet.','err')}
  if(!chan)chan=sb.channel('otk-docs').on('postgres_changes',{event:'*',schema:'public',table:'otk_docs'},applyChange).subscribe(st=>{
    if(st==='SUBSCRIBED'){if(subOnce)loadAll().catch(()=>{});subOnce=true;S.mode='online'}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')S.mode='offline';
    schedule()});
  schedule();
}
window.addEventListener('online',()=>{if(me)loadAll().then(()=>{S.mode='online';schedule()}).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me&&S.mode!=='online')loadAll().catch(()=>{})});
(async()=>{
  if(!window.supabase){$('#view').innerHTML=`<div class="banner warn">${I('alert')}Tidak bisa memuat aplikasi. Pastikan komputer terhubung ke internet lalu muat ulang halaman.</div>`;return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  startOpen();
})();
})();
</script>
</body>
</html>
